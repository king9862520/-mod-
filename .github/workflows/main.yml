name: Build and Release ONI Hub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean ONIHub.spec

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\ONIHub.exe" "release\ONIHub.exe"
          Copy-Item "LICENSE" "release\LICENSE"
          Copy-Item "README.md" "release\README.md"

          Compress-Archive `
            -Path "release\ONIHub.exe","release\LICENSE","release\README.md" `
            -DestinationPath "ONIHub-${{ github.ref_name }}-windows-x64.zip" `
            -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "ONIHub-${{ github.ref_name }}-windows-x64.zip" `
            --title "ONI Hub ${{ github.ref_name }}" `
            --generate-notes `
            --prerelease
